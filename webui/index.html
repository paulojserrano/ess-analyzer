<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ESS Analyzer</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23e94560'/%3E%3Cpath d='M8 22V14M14 22V9M20 22v-6M26 22V12' stroke='white' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/app.css">
<script>
  // Apply the saved theme before first paint (no flash).
  try {
    var t = localStorage.getItem("ess.theme");
    if (t === "dark" || t === "light") document.documentElement.dataset.theme = t;
  } catch (e) {}
</script>
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="currentColor"/><path d="M8 22V14M14 22V9M20 22v-6M26 22V12" stroke="#fff" stroke-width="3" stroke-linecap="round"/></svg>
      </div>
      <div>
        <div class="brand-name">ESS Analyzer</div>
        <div class="brand-sub">Station &amp; robot cycles</div>
      </div>
    </div>
    <nav class="nav" id="nav">
      <button class="nav-item" data-page="data"><span class="ico" data-icon="files"></span><span>Data</span><span class="nav-badge" id="badge-data"></span></button>
      <button class="nav-item" data-page="configure"><span class="ico" data-icon="sliders"></span><span>Settings</span></button>
      <button class="nav-item" data-page="run"><span class="ico" data-icon="play"></span><span>Run</span><span class="nav-badge" id="badge-run"></span></button>
      <button class="nav-item" data-page="results"><span class="ico" data-icon="chart"></span><span>Results</span></button>
      <button class="nav-item" data-page="history"><span class="ico" data-icon="clock"></span><span>History</span></button>
    </nav>
    <div class="sidebar-foot">
      <button class="side-btn" id="theme-btn" title="Toggle light / dark theme"><span class="ico" data-icon="moon"></span><span id="theme-label">Dark theme</span></button>
      <div class="version" id="version"></div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div>
        <h1 id="page-title">Data</h1>
        <p id="page-sub" class="muted"></p>
      </div>
      <div class="topbar-actions">
        <div class="status-pill" id="status-pill"><span class="dot"></span><span id="status-text">Ready</span></div>
        <button class="btn primary" id="run-btn"><span class="ico" data-icon="play"></span>Run analysis</button>
      </div>
    </header>

    <section class="page" id="page-data"></section>
    <section class="page" id="page-configure"></section>
    <section class="page" id="page-run"></section>
    <section class="page" id="page-results"></section>
    <section class="page" id="page-history"></section>
  </main>
</div>

<div class="drop-overlay" id="drop-overlay"><div><span class="ico xl" data-icon="upload"></span><p>Drop logs to add them</p></div></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<input type="file" id="file-input" multiple accept=".log,.gz" hidden>

<script src="/static/app.js"></script>
</body>
</html>
